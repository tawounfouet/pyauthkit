name: Python quality and package qualification (M0 candidate)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# No release secrets and no id-token permission in pull request workflows.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, unit and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (actions/checkout v5.0.1, pinned)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Python (actions/setup-python v6.0.0, pinned)
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Install checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,password,qualification]"
          python -m pip freeze
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy strict
        run: python -m mypy src/pyauthkit
      - name: Tests
        run: python -m pytest -v
      - name: Architecture fitness
        run: python scripts/check_architecture.py
      - name: Workflow privilege and SHA guard
        run: python scripts/check_workflow_security.py

  compatibility:
    name: Wheel / sdist / smoke (${{ matrix.os }} Py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ matrix.python }}
      - name: Build and test
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,password]"
          python -m pytest -v
          python -m build
          python scripts/smoke_wheel.py
      - name: Package metadata inspection
        shell: bash
        run: python -m twine check dist/*

  security:
    name: Dependency, source and secret scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Prepare isolated audit environment
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install --upgrade pip
          .audit-venv/bin/python -m pip install ".[dev,password,qualification,security]"
          .audit-venv/bin/python -m pip freeze
      - name: Dependency vulnerability scan
        run: |
          .audit-venv/bin/python -m pip uninstall -y pyauthkit
          .audit-venv/bin/python -m pip_audit --strict
      - name: Static security patterns in runtime source
        run: .audit-venv/bin/python -m bandit -r src -ll -ii
      - name: Search checked-in secrets
        run: |
          .audit-venv/bin/detect-secrets scan --all-files --exclude-files '([.]audit-venv/|[.]secret-scan[.]json|[.]git/)' > .secret-scan.json
          python scripts/check_secret_scan.py .secret-scan.json

  m4_host:
    name: M4 PostgreSQL Redis HTTP qualification (reference only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: m4qual
          POSTGRES_USER: m4qual
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 54328:5432
        options: >-
          --health-cmd "pg_isready -U m4qual -d m4qual"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 63798:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      M4_PG_DSN: postgresql://m4qual:${{ github.run_id }}@127.0.0.1:54328/m4qual
      M4_REDIS_URL: redis://127.0.0.1:63798/15
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Install standalone M4 qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" "asyncpg>=0.30" "redis>=5" "fastapi>=0.110" "uvicorn>=0.30" "httpx>=0.27" "pytest-asyncio>=0.24"
      - name: PostgreSQL CAS Redis atomic and real two-process HTTP tests
        run: python -m pytest -v -s qualification/m4_host/tests


  m5_jwt:
    name: M5 JWT proof and JWKS cache (candidate only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Install M5 JOSE qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,jwt]"
      - name: OpenSSL external signing tool required
        run: openssl version
      - name: Verify M5 signed tokens, network boundaries and independent vectors
        run: |
          python -m pytest -v tests/integration/test_m5_jwt_authentication.py tests/security/test_m5_jwks_cache.py tests/security/test_m5_jwks_https.py tests/qualification/test_m5_openssl_vectors.py tests/qualification/test_m5_jwks_tls_host.py
      - name: Build wheel and install optional JOSE extra
        run: |
          python -m build
          python -m venv .m5-wheel
          .m5-wheel/bin/python -m pip install "$(ls dist/*.whl)[jwt]"
          .m5-wheel/bin/python -c "import pyauthkit; from pyauthkit.adapters.jwt_crypto import PyJwtRs256Verifier; assert PyJwtRs256Verifier()"

  m6_boundaries:
    name: M6 configuration, secret consumer and audit boundaries (candidate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Install M6 qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Execute M6 negative and integration security oracles
        run: |
          python -m pytest -v tests/security/test_m6_configuration_trust.py tests/security/test_m6_secret_policy.py tests/integration/test_m6_secret_backed_api_key.py tests/integration/test_m6_jwt_trust_bootstrap.py tests/security/test_m6_json_reader.py tests/security/test_m6_source_precedence.py tests/security/test_m6_metrics_privacy.py tests/integration/test_m6_generation_sqlite.py tests/security/test_m6_aws_secrets.py tests/integration/test_m6_aws_sdk_stubber.py tests/security/test_m6_aws_client_admission.py tests/security/test_m6_aws_live_gate.py tests/integration/test_m6_audit_sqlite.py tests/integration/test_m6_receipted_audit_gateway.py tests/integration/test_m6_receipted_real_m4_m5.py

  m6_http_reference:
    name: M6 real HTTP receipt boundary (local reference only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Install isolated HTTP qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" "fastapi>=0.110" "uvicorn>=0.30" "httpx>=0.27" "pytest-asyncio>=0.24"
      - name: Exercise actual loopback HTTP and SQLite failure oracles
        run: |
          python -m pytest -v qualification/m6_http/tests

  m3_host:
    name: M3 Password PostgreSQL Redis HTTP qualification (reference only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: m3qual
          POSTGRES_PASSWORD: m3qual_ci_synthetic_only  # pragma: allowlist secret
          POSTGRES_DB: m3qual
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m3qual -d m3qual"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Install M3 host qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,password,qualification]"
      - name: Host PostgreSQL Redis real HTTP and security regression suite
        env:
          M3_PG_DSN: postgresql://m3qual:m3qual_ci_synthetic_only@127.0.0.1:5432/m3qual # pragma: allowlist secret
          M3_REDIS_URL: redis://127.0.0.1:6379/15
        run: python -m pytest -v -s qualification/host/tests
      - name: M3 KDF performance study (informational only)
        run: python scripts/benchmark_m3_password.py

  m7_sdk_plugins:
    name: M7 public SDK and plugin admission (candidate, pre-alpha)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Install standalone M7 test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Execute M7 SDK and plugin admission tests
        run: |
          python -m pytest -v tests/unit/test_m7_sdk_public_api.py tests/security/test_m7_plugin_admission.py tests/security/test_m7_plugin_lifecycle.py tests/security/test_m7_plugin_scope.py tests/security/test_m7_plugin_positive_proof.py
      - name: Build wheel and sdist
        run: python -m build
      - name: Isolated wheel import and Python-only quickstart
        run: |
          python -m venv .m7-wheel
          .m7-wheel/bin/python -m pip install --no-deps "$(ls dist/pyauthkit-*.whl)"
          .m7-wheel/bin/python -c "import pyauthkit.sdk, pyauthkit.plugins; from importlib.metadata import version; assert version('pyauthkit') == pyauthkit.sdk.__version__ if hasattr(pyauthkit.sdk, '__version__') else version('pyauthkit') == '0.1.0a1'"
          .m7-wheel/bin/python examples/m7_pure_python.py
          .m7-wheel/bin/python -c "from zipfile import ZipFile; from pathlib import Path; w = next(Path('dist').glob('pyauthkit-*.whl')); z = ZipFile(w); assert 'pyauthkit/py.typed' in z.namelist(); assert 'pyauthkit/plugins/admission.py' in z.namelist()"
      - name: Build and install independent synthetic plugin wheel
        run: |
          python -m build --wheel --outdir dist/m7-plugin qualification/m7_sdk/synthetic_plugin
          .m7-wheel/bin/python -m pip install --no-deps "$(ls dist/m7-plugin/pyauthkit_m7_synthetic_plugin-*.whl)"
          .m7-wheel/bin/python scripts/smoke_m7_installed_plugin.py
