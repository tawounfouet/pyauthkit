name: Python quality and package qualification (M0 candidate)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# No release secrets and no id-token permission in pull request workflows.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, unit and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (actions/checkout v5.0.1, pinned)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Python (actions/setup-python v6.0.0, pinned)
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Install checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip freeze
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy strict
        run: python -m mypy src/pyauthkit
      - name: Tests
        run: python -m pytest -v
      - name: Architecture fitness
        run: python scripts/check_architecture.py
      - name: Workflow privilege and SHA guard
        run: python scripts/check_workflow_security.py

  compatibility:
    name: Wheel / sdist / smoke (${{ matrix.os }} Py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ matrix.python }}
      - name: Build and test
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pytest -v
          python -m build
          python scripts/smoke_wheel.py
      - name: Package metadata inspection
        shell: bash
        run: python -m twine check dist/*

  security:
    name: Dependency, source and secret scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Prepare isolated audit environment
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install --upgrade pip
          .audit-venv/bin/python -m pip install ".[dev,security]"
          .audit-venv/bin/python -m pip freeze
      - name: Dependency vulnerability scan
        run: |
          .audit-venv/bin/python -m pip uninstall -y pyauthkit
          .audit-venv/bin/python -m pip_audit --strict
      - name: Static security patterns in runtime source
        run: .audit-venv/bin/python -m bandit -r src -ll -ii
      - name: Search checked-in secrets
        run: |
          .audit-venv/bin/detect-secrets scan --all-files --exclude-files '([.]audit-venv/|[.]secret-scan[.]json|[.]git/)' > .secret-scan.json
          python scripts/check_secret_scan.py .secret-scan.json

  m4_host:
    name: M4 PostgreSQL Redis HTTP qualification (reference only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: m4qual
          POSTGRES_USER: m4qual
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 54328:5432
        options: >-
          --health-cmd "pg_isready -U m4qual -d m4qual"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 63798:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      M4_PG_DSN: postgresql://m4qual:${{ github.run_id }}@127.0.0.1:54328/m4qual
      M4_REDIS_URL: redis://127.0.0.1:63798/15
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Install standalone M4 qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" "asyncpg>=0.30" "redis>=5" "fastapi>=0.110" "uvicorn>=0.30" "httpx>=0.27" "pytest-asyncio>=0.24"
      - name: PostgreSQL CAS Redis atomic and real two-process HTTP tests
        run: python -m pytest -v -s qualification/m4_host/tests
