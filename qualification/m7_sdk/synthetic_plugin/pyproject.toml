[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pyauthkit-m7-synthetic-plugin"
version = "0.0.1"
description = "M7 qualification-only rejection plugin, not a credential verifier"
requires-python = ">=3.12"
dependencies = ["pyauthkit>=0.1.0a1"]

[project.entry-points."pyauthkit.authenticators.v1"]
synthetic = "m7_synthetic_plugin.factory:create"
managed = "m7_synthetic_plugin.factory:create_managed"
positive-test-only = "m7_synthetic_plugin.factory:create_positive_test_only"

[project.entry-points."pyauthkit.authenticators.v2"]
host-scoped = "m7_synthetic_plugin.v2:create_host_scoped"

[tool.hatch.build.targets.wheel]
packages = ["src/m7_synthetic_plugin"]
