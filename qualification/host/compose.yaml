# Synthetic, disposable M3 qualification resources only. NO REAL ACCOUNTS.
name: pyauthkit-m3-qualification
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: m3qual
      POSTGRES_PASSWORD: m3qual_ci_synthetic_only  # pragma: allowlist secret
      POSTGRES_DB: m3qual
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m3qual -d m3qual"]
      interval: 3s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
    tmpfs:
      - /data
